<!DOCTYPE html>
<html>
<head>
  <title>User Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body{
      background: linear-gradient(135deg,#eef2ff,#f8fafc);
      font-family: 'Segoe UI', sans-serif;
    }

    .sidebar{
      height:100vh;
      width:240px;
      position:fixed;
      background: #0f172a;
      padding:20px;
      color:white;
    }

    .sidebar h3{
      font-weight:800;
      margin-bottom:30px;
      color:#60a5fa;
    }

    .sidebar a{
      display:block;
      padding:12px;
      margin-bottom:10px;
      color:#cbd5e1;
      text-decoration:none;
      border-radius:10px;
    }

    .sidebar a:hover{
      background:#1e293b;
    }

    .report-btn{
      width:100%;
      margin-top:15px;
      background:#ef4444;
      border:none;
      color:white;
      padding:12px;
      border-radius:10px;
      font-weight:700;
    }

    .update-btn{
      width:100%;
      margin-top:10px;
      background:#2563eb;
      border:none;
      color:white;
      padding:12px;
      border-radius:10px;
      font-weight:700;
    }

    .logout-btn{
      width:100%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#ef4444;
      color:white;
      font-weight:700;
    }

    .main{
      margin-left:260px;
      padding:30px;
    }

    .topbar{
      background: rgba(255,255,255,0.9);
      padding:18px 25px;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      margin-bottom:25px;
    }

    .card-box{
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 10px 25px rgba(0,0,0,0.06);
      text-align:center;
    }

    .table-box{
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 10px 25px rgba(0,0,0,0.06);
    }

    .modal-bg{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      justify-content:center;
      align-items:center;
    }

    .modal-box{
      background:white;
      padding:25px;
      border-radius:15px;
      width:400px;
    }

  </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <h3>💼 Job Portal</h3>

  <a href="#">Dashboard</a>
  <a href="jobs.html">Jobs</a>
  <a href="#applicationSection">Applications</a>

  <button class="report-btn" onclick="openReport()">🚨 Report Company</button>
  <button class="update-btn" onclick="openUpdate()">✏️ Update Profile</button>

  <button class="logout-btn" onclick="logout()">Logout</button>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar d-flex justify-content-between align-items-center">
    <h4>User Dashboard</h4>
    <h5>Welcome, <b id="username"></b></h5>
  </div>

  <!-- USER INFO -->
  <div class="row">

    <div class="col-md-6">
      <div class="card-box">
        <h6>Email</h6>
        <h5 id="userEmail"></h5>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card-box">
        <h6>Status</h6>
        <h5 style="color:#16a34a;">Active</h5>
      </div>
    </div>

  </div>

  <!-- REPORT SUMMARY -->
  <div class="mt-5">

    <div class="row">

      <div class="col-md-4">
        <div class="card-box">
          <h6>Total</h6>
          <h1 id="reportTotal">0</h1>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-box">
          <h6 style="color:green;">Accepted</h6>
          <h1 id="reportAccepted">0</h1>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-box">
          <h6 style="color:red;">Rejected</h6>
          <h1 id="reportRejected">0</h1>
        </div>
      </div>

    </div>

  </div>

  <!-- APPLICATION TABLE -->
  <div class="table-box mt-5">

    <h3>Applications</h3>

    <table class="table">
      <thead>
      <tr>
        <th>Job</th>
        <th>Company</th>
        <th>Status</th>
      </tr>
      </thead>
      <tbody id="applicationTable"></tbody>
    </table>

  </div>

</div>

<!-- REPORT MODAL -->
<div class="modal-bg" id="reportModal">
  <div class="modal-box">

    <h4>🚨 Report Company</h4>

    <select id="company" class="form-control mt-2"></select>
    <textarea id="issue" class="form-control mt-2" placeholder="Write your issue..."></textarea>

    <button class="btn btn-danger w-100 mt-3" onclick="submitReport()">Submit</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="closeReport()">Close</button>

  </div>
</div>

<!-- UPDATE MODAL -->
<div class="modal-bg" id="updateModal">
  <div class="modal-box">

    <h4>✏️ Update Profile</h4>

    <input id="editName" class="form-control mt-2" placeholder="Name">
    <input id="editSkills" class="form-control mt-2" placeholder="Skills">

    <button class="btn btn-primary w-100 mt-3" onclick="updateProfile()">Save</button>
    <button class="btn btn-secondary w-100 mt-2" onclick="closeUpdate()">Close</button>

  </div>
</div>

<script>

  let user = JSON.parse(localStorage.getItem("user"));

  if(!user){
    window.location.href="login.html";
  }

  // UI LOAD
  document.getElementById("username").innerText = user.name;
  document.getElementById("userEmail").innerText = user.email;

  // APPLICATIONS
  fetch("http://localhost:8080/application/user/" + user.email)
          .then(res=>res.json())
          .then(data=>{
            let rows="",a=0,r=0;

            data.forEach(app=>{
              if(app.status==="ACCEPTED") a++;
              if(app.status==="REJECTED") r++;

              rows+=`
      <tr>
        <td>${app.jobTitle}</td>
        <td>${app.companyName}</td>
        <td>${app.status}</td>
      </tr>`;
            });

            document.getElementById("applicationTable").innerHTML=rows;
            document.getElementById("reportTotal").innerText=data.length;
            document.getElementById("reportAccepted").innerText=a;
            document.getElementById("reportRejected").innerText=r;
          });

  // REPORT
  function openReport(){
    document.getElementById("reportModal").style.display="flex";

    fetch("http://localhost:8080/jobs/all")
            .then(res=>res.json())
            .then(data=>{
              let companies=[...new Set(data.map(j=>j.companyName))];
              let html=`<option>Select Company</option>`;
              companies.forEach(c=>{
                html+=`<option value="${c}">${c}</option>`;
              });
              document.getElementById("company").innerHTML=html;
            });
  }

  function closeReport(){
    document.getElementById("reportModal").style.display="none";
  }

  function submitReport(){
    fetch("http://localhost:8080/report/send",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        userName:user.name,
        userEmail:user.email,
        companyName:document.getElementById("company").value,
        issue:document.getElementById("issue").value,
        status:"PENDING"
      })
    }).then(()=>{
      alert("Report sent");
      closeReport();
    });
  }

  // UPDATE PROFILE
  function openUpdate(){
    document.getElementById("updateModal").style.display="flex";
    document.getElementById("editName").value=user.name;
    document.getElementById("editSkills").value=user.skills||"";
  }

  function closeUpdate(){
    document.getElementById("updateModal").style.display="none";
  }

  function updateProfile(){
    fetch("http://localhost:8080/users/"+user.id,{
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name:document.getElementById("editName").value,
        email:user.email,
        skills:document.getElementById("editSkills").value
      })
    })
            .then(res=>res.json())
            .then(data=>{
              user=data;
              localStorage.setItem("user",JSON.stringify(user));

              document.getElementById("username").innerText=data.name;

              alert("Profile Updated");
              closeUpdate();
            });
  }

  // LOGOUT
  function logout(){
    localStorage.clear();
    window.location.href="login.html";
  }

</script>

</body>
</html>
